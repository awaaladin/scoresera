{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Junior Achievement Nigeria{% endblock %}</title>
    <meta name="description" content="{% block description %}Competition Scoring System for Junior Achievement Nigeria{% endblock %}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ja: {
                            DEFAULT: '#285F74',
                            50: '#e8f4f8',
                            100: '#c5e3ec',
                            200: '#9fd1e0',
                            300: '#79bed3',
                            400: '#5cafc9',
                            500: '#3f9fbf',
                            600: '#285F74',
                            700: '#1f4a5b',
                            800: '#163542',
                            900: '#0d2029',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Styles -->
    <style>
        [x-cloak] { display: none !important; }
        
        /* Force cursor pointer on all interactive elements */
        a { cursor: pointer !important; pointer-events: auto !important; }
        button { cursor: pointer !important; pointer-events: auto !important; }
        [role="button"] { cursor: pointer !important; pointer-events: auto !important; }
        .cursor-pointer { cursor: pointer !important; pointer-events: auto !important; }
        input[type="submit"], input[type="button"] { cursor: pointer !important; }
        
        .sidebar-link.active {
            background-color: #285F74;
            color: white;
        }
        .bg-ja { background-color: #285F74; }
        .bg-ja-dark { background-color: #1f4a5b; }
        .bg-ja-light { background-color: #3a7a91; }
        .text-ja { color: #285F74; }
        .text-ja-light { color: #5cafc9; }
        .border-ja { border-color: #285F74; }
        .hover\:bg-ja-dark:hover { background-color: #1f4a5b; }
        .hover\:text-ja:hover { color: #285F74; }
        .focus\:ring-ja:focus { --tw-ring-color: #285F74; }
        .focus\:border-ja:focus { border-color: #285F74; }
        
        /* Ensure nothing blocks clicks */
        nav a, section a, footer a, .btn, button {
            position: relative;
            z-index: 10;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    {% block content %}{% endblock %}
    
    <!-- Define scripts first -->
    {% block extra_js %}{% endblock %}
    
    <!-- Alpine.js for interactivity - must load AFTER function definitions -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        // Initialize Lucide icons after page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
        
        // Re-initialize icons when Alpine is ready
        document.addEventListener('alpine:initialized', function() {
            setTimeout(function() {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, 100);
        });
    </script>
</body>
</html>
