services:
  - type: web
    name: score-set
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: cd counter && python -m gunicorn wsgi:application --bind 0.0.0.0:$PORT
    rootDir: score_set/SHACK360_pkg
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
